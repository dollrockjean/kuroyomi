<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151518"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
  </defs>
  <!-- Full square background for native iOS/Android clipping -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Subtle inner perimeter line -->
  <rect x="20" y="20" width="472" height="472" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  
  <g id="bookMark" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left open page -->
    <path d="M 244 125 C 188 102, 122 110, 80 138 L 80 360 C 122 332, 188 324, 244 346 Z" fill="#1b1b20" stroke="#ffffff" stroke-width="9"/>
    <!-- Right open page -->
    <path d="M 268 125 C 324 102, 390 110, 432 138 L 432 360 C 390 332, 324 324, 268 346 Z" fill="#1b1b20" stroke="#ffffff" stroke-width="9"/>
    <!-- Page lines left -->
    <line x1="120" y1="175" x2="212" y2="162" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="120" y1="220" x2="212" y2="207" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="120" y1="265" x2="212" y2="252" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="120" y1="310" x2="212" y2="297" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <!-- Page lines right -->
    <line x1="300" y1="162" x2="392" y2="175" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="300" y1="207" x2="392" y2="220" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="300" y1="252" x2="392" y2="265" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
    <line x1="300" y1="297" x2="392" y2="310" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.5"/>
  </g>
  
  <!-- Central Emblem Badge -->
  <circle cx="256" cy="235" r="62" fill="#09090b" stroke="#ffffff" stroke-width="6"/>
  <text x="256" y="258" fill="url(#accentGrad)" font-family="Georgia, serif" font-weight="900" font-size="68" text-anchor="middle">B</text>

  <!-- Bottom Brand Label -->
  <g transform="translate(256, 436)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="0" y="6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="3.5" text-anchor="middle">BYOB</text>
  </g>
</svg>
